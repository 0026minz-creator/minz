<!-- AI Video Content Maker - Version 2.1 (Fix: Restored Missing Functions & History Logic) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영상 콘텐츠 제작기 (Ver 2.1)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- JSZip 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .history-item { transition: all 0.2s ease; }
        .history-item:hover { transform: translateX(4px); }
        .history-item.active { border-color: #3b82f6; background-color: #eff6ff; }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden flex font-sans text-gray-800">

    <!-- 좌측 패널 -->
    <aside class="w-[30%] bg-white border-r border-gray-200 flex flex-col h-full shadow-lg z-10">
        <div class="p-6 border-b border-gray-200">
            <div class="flex items-center justify-between mb-1">
                <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                    <i class="fa-solid fa-video"></i> AI 스튜디오
                </h1>
                <select id="versionSelect" class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded border border-blue-200 focus:outline-none cursor-pointer hover:bg-blue-100 transition">
                    <option value="v2">v2.1 (Pro)</option>
                    <option value="v1">v1.0 (Basic)</option>
                </select>
            </div>
            <p class="text-sm text-gray-500 mb-4">대본, 이미지, 음성을 한 번에</p>

            <!-- API Key Input -->
            <div class="mb-1">
                <div class="relative">
                    <input type="password" id="apiKeyInput" placeholder="Google API Key 입력" class="w-full p-2 text-xs border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none transition" onchange="updateApiKey(this.value)">
                    <i class="fa-solid fa-key absolute right-3 top-2.5 text-gray-400 text-xs"></i>
                </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-6">

                <h2 class="text-lg font-semibold border-l-4 border-blue-500 pl-2">1. 콘텐츠 설정</h2>
                <div class="relative">
                    <label class="block text-sm font-medium text-gray-700 mb-1">주제 입력</label>
                    <div class="flex gap-2">

            <hr class="border-gray-200">

            <!-- 1.5 음성 설정 -->
            <section class="space-y-4">
                <h2 class="text-lg font-semibold border-l-4 border-green-500 pl-2">2. 음성(보이스) 설정</h2>
                <div class="space-y-2">
                    <div class="flex items-center justify-between p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition"><label class="flex items-center cursor-pointer flex-1 gap-2"><input type="radio" name="voice" value="Kore" class="w-4 h-4 text-blue-600 focus:ring-blue-500" checked><span class="text-sm">👩 여성 1 (차분함)</span></label><button onclick="previewVoice('Kore', this)" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-play-circle text-xl"></i></button></div>
                    <div class="flex items-center justify-between p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition"><label class="flex items-center cursor-pointer flex-1 gap-2"><input type="radio" name="voice" value="Aoede" class="w-4 h-4 text-blue-600 focus:ring-blue-500"><span class="text-sm">👧 여성 2 (밝음)</span></label><button onclick="previewVoice('Aoede', this)" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-play-circle text-xl"></i></button></div>
                    <div class="flex items-center justify-between p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition"><label class="flex items-center cursor-pointer flex-1 gap-2"><input type="radio" name="voice" value="Fenrir" class="w-4 h-4 text-blue-600 focus:ring-blue-500"><span class="text-sm">👨 남성 1 (중저음)</span></label><button onclick="previewVoice('Fenrir', this)" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-play-circle text-xl"></i></button></div>
                    <div class="flex items-center justify-between p-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition"><label class="flex items-center cursor-pointer flex-1 gap-2"><input type="radio" name="voice" value="Orus" class="w-4 h-4 text-blue-600 focus:ring-blue-500"><span class="text-sm">👦 남성 2 (부드러움)</span></label><button onclick="previewVoice('Orus', this)" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-play-circle text-xl"></i></button></div>

                </div>

                            <div id="char-analyzing" class="hidden absolute inset-0 bg-black bg-opacity-50 flex flex-col items-center justify-center text-white text-xs z-10"><div class="loader mb-2 w-5 h-5 border-white border-t-transparent"></div>분석 중...</div>
                            <input id="dropzone-file" type="file" class="hidden" accept="image/*" />
                        </label>
                    </div>
                    <div id="char-features-box" class="hidden mt-2 p-2 bg-purple-50 border border-purple-100 rounded text-xs text-purple-800"><p class="font-bold mb-1">🤖 분석된 캐릭터 특징:</p><p id="char-features-text" class="line-clamp-2 leading-relaxed opacity-80 italic">...</p></div>
                </div>
            </section>
            <hr class="border-gray-200">

            <!-- 4. 작업 기록 (History) -->
            <section id="historySection" class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold border-l-4 border-gray-500 pl-2">4. 작업 기록</h2>
                    <span class="text-xs text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">기록</span>

        <div class="p-6 border-t border-gray-200 bg-gray-50">
            <button id="generateBtn" onclick="startPlanning()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transform transition hover:scale-[1.02] flex items-center justify-center gap-2">
                <i class="fa-solid fa-pen-nib"></i><span>1단계: 기획안(대본) 생성</span>
            </button>
        </div>
    </aside>

    <!-- 우측 패널 -->
    <main class="w-[70%] h-full flex flex-col bg-gray-100">
        <div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm z-10">
            <h2 class="text-lg font-semibold text-gray-700">작업 결과물 (12 Scenes)</h2>
            <div class="flex items-center gap-2">
                 <button id="downloadAllBtn" onclick="downloadAllAssets()" class="hidden text-sm bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition items-center gap-2 shadow-sm"><i class="fa-solid fa-file-zipper"></i> 전체 다운로드 (.zip)</button>
                 <div class="h-6 w-px bg-gray-300 mx-2"></div>
                 <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded">대본</span>
                 <span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded">이미지</span>
                 <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">오디오</span>
            </div>
        </div>
        <div id="resultsContainer" class="flex-1 overflow-y-auto p-8 space-y-6 scroll-smooth">
            <div id="placeholder" class="h-full flex flex-col items-center justify-center text-gray-400 opacity-60">
                <i class="fa-regular fa-clapperboard text-6xl mb-4"></i>
                <p class="text-lg">왼쪽에서 설정을 완료하고 '1단계: 기획안 생성'을 눌러주세요.</p>
                <p class="text-sm">대본을 먼저 확인한 후 영상을 제작할 수 있습니다.</p>
            </div>
        </div>
    </main>

    <audio id="previewAudio" class="hidden"></audio>

<script type="module">
    // ----------------------------------------------------
    // 1. 초기화 및 유틸리티
    // ----------------------------------------------------
    let apiKey = localStorage.getItem("gemini_api_key") || "";

    // Initialize API Key Input
    document.addEventListener("DOMContentLoaded", () => {
        const input = document.getElementById('apiKeyInput');
        if(input && apiKey) input.value = apiKey;
    });

    window.updateApiKey = function(val) {
        apiKey = val.trim();
        localStorage.setItem("gemini_api_key", apiKey);
        if(apiKey) updateStatus("API Key가 저장되었습니다.");
    }

    // 로깅 함수 (ReferenceError 방지)
    function updateStatus(msg) {
        const sb = document.getElementById('statusBox');
        if(sb) {
            sb.classList.remove('hidden');
            sb.innerHTML = `> ${msg}`;
        }
        console.log(msg);
    }

    function getPlaceholderImage(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 640; canvas.height = 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0, 0, 640, 360);
        ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, 320, 180);
        return canvas.toDataURL('image/png');
    }

    function pcmToWav(base64PCM, sampleRate = 24000) {
        const binaryString = atob(base64PCM);
        const len = binaryString.length;
        const buffer = new Uint8Array(len);
        for (let i = 0; i < len; i++) buffer[i] = binaryString.charCodeAt(i);
        const wavHeader = new ArrayBuffer(44);
        const view = new DataView(wavHeader);
        writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + len, true); writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
        view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data');
        view.setUint32(40, len, true);
        const blob = new Blob([view, buffer], { type: 'audio/wav' });
        return blob;
    }
    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    // ----------------------------------------------------
    // 2. 상태 변수 및 DOM
    // ----------------------------------------------------
    let generatedAssets = { scripts: [], images: {}, audio: {} };
    let marketingData = null;
    let generationHistory = [];
    let historyCount = 0;
    let characterDescriptionPrompt = "";
    let marketingContainer = null;
    let currentVersion = 'v2';

    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const resultsContainer = document.getElementById('resultsContainer');
    const placeholder = document.getElementById('placeholder');
    const dropzoneFile = document.getElementById('dropzone-file');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const historyList = document.getElementById('historyList');
    const versionSelect = document.getElementById('versionSelect');
    const historySection = document.getElementById('historySection');
    const topicInput = document.getElementById('topicInput');
    const charPreview = document.getElementById('char-preview');
    const uploadPlaceholder = document.getElementById('upload-placeholder');
    const charAnalyzing = document.getElementById('char-analyzing');
    const charFeaturesBox = document.getElementById('char-features-box');
    const charFeaturesText = document.getElementById('char-features-text');
    const previewAudioPlayer = document.getElementById('previewAudio');

    // 이벤트 리스너
    versionSelect.addEventListener('change', (e) => {
        currentVersion = e.target.value;
        toggleVersionFeatures();
    });

    function toggleVersionFeatures() {
        if (currentVersion === 'v1') {
            historySection.classList.add('hidden');
            if (marketingContainer) marketingContainer.parentElement.classList.add('hidden');
        } else {
            historySection.classList.remove('hidden');
            if (marketingContainer) marketingContainer.parentElement.classList.remove('hidden');
        }
    }

    // 캐릭터 분석 (Vision API)
    dropzoneFile.addEventListener('change', async (e) => {
        if (!apiKey) { alert("API Key를 입력해주세요!"); document.getElementById('apiKeyInput').focus(); return; }
        if(e.target.files?.[0]) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                charPreview.src = base64;
                charPreview.classList.remove('hidden');
                uploadPlaceholder.classList.add('hidden');

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey.trim()}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Describe character appearance briefly." }, { inlineData: { mimeType: "image/png", data: base64.split(',')[1] } }] }]
                        })
                    });
                    const data = await response.json();
                    characterDescriptionPrompt = data.candidates[0].content.parts[0].text;
                    charFeaturesText.innerText = characterDescriptionPrompt;
                    charFeaturesBox.classList.remove('hidden');
                } catch(err) { console.error(err); }
            };
            reader.readAsDataURL(file);
        }
    });

    // ----------------------------------------------------
    // 3. 주요 기능 함수 (기획 -> 제작)
    // ----------------------------------------------------

    // 미리듣기 기능
    window.previewVoice = async function(voiceName, btn) {
        if (!apiKey) { alert("API Key를 입력해주세요!"); document.getElementById('apiKeyInput').focus(); return; }

        const originalIcon = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;

        try {
            const text = "안녕하세요, 제 목소리 어떠신가요?";
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: text }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceName } } } } })
            });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            const inlineData = data.candidates[0].content.parts[0].inlineData;
            const wavBlob = pcmToWav(inlineData.data);

            const audio = document.getElementById('previewAudio');
            audio.src = URL.createObjectURL(wavBlob);
            audio.play();
            updateStatus(`${voiceName} 목소리 미리듣기 중...`);
        } catch (e) {
            console.error(e);
            alert("미리듣기 실패: " + e.message);
        } finally {
            btn.innerHTML = originalIcon;
        }
    };

    // 전역 함수로 노출
    window.startPlanning = async function() {
        if (!apiKey) { alert("API Key를 입력해주세요!"); document.getElementById('apiKeyInput').focus(); return; }

        const topic = document.getElementById('topicInput').value;
        if (!topic) { alert("주제를 입력해주세요!"); return; }

        const duration = document.getElementById('durationSelect').value;

    function addToHistory(topic, assets, aspectRatio) {
        if (currentVersion === 'v1') return;

        const now = new Date();
        const timestamp = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        const historyItem = {
            id: historyCount, topic: topic, timestamp: timestamp,
            assets: {
                scripts: JSON.parse(JSON.stringify(assets.scripts)),
                images: {...assets.images}, audio: {...assets.audio}

            aspectRatio: aspectRatio,
            marketingData: marketingData ? JSON.parse(JSON.stringify(marketingData)) : null

    async function generateScript(topic, duration, style, lang) {
        const systemPrompt = `Create 12 scenes video script. Topic: ${topic}, Style: ${style}, Lang: ${lang}.
        Requirements:
        1. "script_local": Script in ${lang}.
        2. "script_korean": Script in Korean.
        3. "image_prompt": Detailed image prompt (NO TEXT).
        4. "image_desc_ko": Image description in Korean.
        5. "search_keywords": 3 keywords in Japanese/English/Korean.
        6. Character: Korean Woman.
        7. Background Text: Native language of location.
        Output: JSON Array.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey.trim()}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Make script." }] }], systemInstruction: { parts: [{ text: systemPrompt }] }, generationConfig: { responseMimeType: "application/json" } })
        });
        if (!response.ok) throw new Error("API Error");
        const data = await response.json();
        const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(jsonText);
        return Array.isArray(parsed) ? parsed : parsed.scenes;
    }

    async function generateImageForScene(originalPrompt, cardId, sceneNum, aspectRatio, isCharVisible) {
        const imgElement = document.getElementById(`img-result-${sceneNum}`);
        const loaderElement = document.getElementById(`img-loader-${sceneNum}`);
        let finalPrompt = isCharVisible ? `An image of Korean Woman. ${originalPrompt}. NO TEXT.` : `Cinematic image. ${originalPrompt}. NO TEXT.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey.trim()}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instances: [{ prompt: finalPrompt }], parameters: { sampleCount: 1, aspectRatio: aspectRatio } })
            });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            const fullBase64 = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
            imgElement.src = fullBase64; imgElement.classList.remove('hidden'); loaderElement.classList.add('hidden');
            generatedAssets.images[sceneNum] = fullBase64;
        } catch (e) {
            imgElement.src = getPlaceholderImage("이미지 생성 불가"); imgElement.classList.remove('hidden'); loaderElement.classList.add('hidden');
            generatedAssets.images[sceneNum] = imgElement.src;
        }
    }

    async function generateAudioForScene(scriptText, cardId, sceneNum, selectedVoice) {
        const container = document.getElementById(`audio-container-${sceneNum}`);
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey.trim()}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: scriptText }] }], generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } } } } })
            });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            const inlineData = data.candidates[0].content.parts[0].inlineData;
            const wavBlob = pcmToWav(inlineData.data);
            container.innerHTML = `<audio controls class="w-full h-8"><source src="${URL.createObjectURL(wavBlob)}" type="audio/wav"></audio>`;
            generatedAssets.audio[sceneNum] = wavBlob;
        } catch (e) { container.innerHTML = `<span class="text-red-500 text-xs">오디오 불가</span>`; }
    }

    window.downloadAllAssets = async function() {
        const zip = new JSZip();
        let fullScriptText = "AI 영상 콘텐츠 제작기 - 대본\n\n";
        generatedAssets.scripts.forEach(s => fullScriptText += `Scene ${s.scene_number}:\n[KO] ${s.script_korean}\n[Local] ${s.script_local}\n\n`);
        zip.file("script.txt", fullScriptText);

        const assetsFolder = zip.folder("assets");
        const projectData = { scenes: [] };

        for (const scene of generatedAssets.scripts) {
            const num = scene.scene_number;
            const paddedNum = String(num).padStart(2, '0');
            const imgName = `scene_${paddedNum}.png`;
            const audName = `scene_${paddedNum}.wav`;

            if (generatedAssets.images[num]) assetsFolder.file(imgName, generatedAssets.images[num].split(',')[1], {base64: true});
            if (generatedAssets.audio[num]) assetsFolder.file(audName, generatedAssets.audio[num]);

            projectData.scenes.push({ id: num, image: `assets/${imgName}`, audio: `assets/${audName}`, subtitle: "" });
        }
        zip.file("project_data.json", JSON.stringify(projectData, null, 2));

        const renderPyContent = `import os\nimport sys\nimport json\nimport platform\ntry:\n    from moviepy import *\nexcept ImportError:\n    print("pip install moviepy 필요")\n    sys.exit()\ndef create_video():\n    print("렌더링 시작")\n    base_dir = os.path.dirname(os.path.abspath(__file__))\n    json_path = os.path.join(base_dir, "project_data.json")\n    output_path = os.path.join(base_dir, "final_video.mp4")\n    if not os.path.exists(json_path): return\n    with open(json_path, 'r', encoding='utf-8') as f: data = json.load(f)\n    clips = []\n    for scene in data.get('scenes', []):\n        img = os.path.join(base_dir, scene['image'])\n        aud = os.path.join(base_dir, scene['audio'])\n        if not os.path.exists(img): continue\n        dur = 3.0\n        audio = None\n        if os.path.exists(aud):\n            try:\n                audio = AudioFileClip(aud)\n                dur = audio.duration\n            except: pass\n        try:\n            vc = ImageClip(img).with_duration(dur).with_fps(24)\n            if audio: vc = vc.with_audio(audio)\n            clips.append(vc)\n        except: pass\n    if clips:\n        final = concatenate_videoclips(clips, method="compose")\n        final.write_videofile(output_path, fps=24)\nif __name__ == "__main__": create_video()`;
        zip.file("render.py", renderPyContent);
        zip.file("README.txt", "1. pip install moviepy\n2. python render.py 실행");

            link.download = "AI_Video_Assets.zip";
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
